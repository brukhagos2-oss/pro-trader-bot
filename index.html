<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ለሊድያዬ ልዩ ስጦታ ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #090414, #1f072e, #3a0b38);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans Ethiopic', sans-serif;
            overflow: hidden;
            color: #fff;
            position: relative;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 182, 193, 0.3);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .heart-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
            color: #ff85a1;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #fce4ec;
            margin-bottom: 25px;
            min-height: 80px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Noto Sans Ethiopic', sans-serif;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #noBtn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            position: absolute;
            right: 50px;
        }
        .hidden {
            display: none;
        }
        .popup {
            margin-top: 15px;
            font-size: 18px;
            color: #52b788;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="card">
        <div class="heart-icon">💖</div>
        <h1>ውዷ ሊድያዬ ❤️</h1>
        <p id="message"></p>
        <div class="buttons" id="btnContainer" style="display: none;">
            <button id="yesBtn" onclick="sayYes()">አዎ፣ እስከመጨረሻው ❤️</button>
            <button id="noBtn" ontouchstart="moveNo()" onmouseover="moveNo()">አይ</button>
        </div>
        <div id="successPopup" class="popup"></div>
    </div>

    <script>
        // Typewriter effect
        const text = "አንቺ በሕይወቴ ውስጥ የገባሽ ልዩ የእግዚአብሔር ስጦታ ነሽ። ሳቅሽ ብርሃኔ፣ ፍቅርሽ ደግሞ ሕይወቴ ነው። ሁሌም ከጎኔ ስለሆንሽ ከልብ አመሰግናለሁ! ሁሌም የኔ ትሆኛለሽ? 💍❤️";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("message").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            } else {
                document.getElementById("btnContainer").style.display = "flex";
            }
        }
        window.onload = typeWriter;

        // No button dodge
        function moveNo() {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            const noBtn = document.getElementById("noBtn");
            noBtn.style.position = "fixed";
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            document.getElementById("btnContainer").style.display = "none";
            document.getElementById("successPopup").innerHTML = "እኔም በጣም እወድሻለሁ ሊድያዬ! የኔ ንግሥት ❤️✨";
        }

        // Background hearts canvas animation
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let hearts = [];
        for (let i = 0; i < 50; i++) {
            hearts.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 8 + 4,
                speed: Math.random() * 1 + 0.5,
                opacity: Math.random() * 0.5 + 0.3
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 105, 180, 0.6)";
            hearts.forEach(h => {
                ctx.globalAlpha = h.opacity;
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.size, 0, Math.PI * 2);
                ctx.fill();
                h.y -= h.speed;
                if (h.y < 0) h.y = canvas.height;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
